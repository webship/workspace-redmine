# Redmine of this project: the official image on the project's own PostgreSQL (the container tool's db service),
# served at the project's address; the project's web container keeps the mail catcher. Written by the Redmine builder of
# the workspace (the plugin's docker-compose.redmine.yaml); build again rather than editing by hand. The site's own
# values (its secret key) are in redmine/env, which only you can read.
services:
  web:
    environment:
      - HTTP_EXPOSE=8093:80,8025:8025
      - HTTPS_EXPOSE=8457:80,8026:8025
  redmine:
    image: "redmine:${REDMINE_VERSION:-7.0.3}"
    container_name: ddev-${DDEV_SITENAME}-redmine
    # As the project's user (its UID and GID), so what Redmine keeps beside its database (its attachments, in
    # ../redmine/files) is the project's own: the row's Backup archives it, and removing the project removes it. The
    # image's entrypoint does its root-only steps (the owner of its files, then its own user) only as root.
    user: "${DDEV_UID}:${DDEV_GID}"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    expose:
      - "3000"
    # The image migrates the database once as it starts, and stops if PostgreSQL does not answer yet: a new project's
    # database is still being made when its container starts, so Redmine waits for it to be healthy.
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${DDEV_APPROOT}/redmine/env
    # Its plugins' assets where any user may write: the image's folder is its redmine user's.
    tmpfs:
      - /usr/src/redmine/public/plugin_assets:mode=1777
    volumes:
      # Its attachments, in the project folder, where the image declares its files volume.
      - ${DDEV_APPROOT}/redmine/files:/usr/src/redmine/files
      # The plugin's scripts, which the builder and the tool run in this container.
      - ${DDEV_APPROOT}/redmine:/opt/webship:ro
    environment:
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: "80:3000"
      HTTPS_EXPOSE: "443:3000"
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_USERNAME: db
      REDMINE_DB_PASSWORD: db
      REDMINE_DB_DATABASE: db
      # A home the project's user may write.
      HOME: /tmp
